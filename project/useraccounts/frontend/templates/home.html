{% extends 'base.html' %}
{% block content %}
{% if plot %}
<br>
<h4><b>Simple Financial Statistics</b></h4>
<!-- Displaying the Plot  -->
<div class="graph-container">
    <div class="graph-placeholder">{{ plot|safe }}</div>
</div>
{% else %}
<p style="display: flex; position: relative; position: fixed; margin-left: 25%; margin-top: 5%;">
    <b>Go to the transaction tab to enter data that will parameterise the graph and be shown in the homepage</b>
</p>
{% endif %}
{% endblock %}
